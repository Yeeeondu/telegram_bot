# ---------- 어닝콜 AI 체크 (모틀리풀 원문) ----------
earnings:
  season_start: "2026-12-01"   # 이 날짜 이후 콜부터 읽음 (12월 발표 회사부터 = 다음 분기 시즌)
  index_from: "2026-09-01"     # 직전 분기(3Q26) 비교용으로 이 날짜부터 원문 목록만 모아 둠 (비용 없음)
  screen_model: claude-haiku-5-5   # 1차 거르기 (싼 모델)
  model: claude-sonnet-5-5         # 원문 번역·직전 분기 비교
  workers: 4
  max_usd_per_quarter: 80      # 분기 누적 Claude 이용료가 이 금액을 넘으면 그 분기는 멈추고 알림
  price_per_mtok:              # 달러 / 100만 토큰 [입력, 출력]
    claude-haiku-5-5: [0.10, 0.50]
    claude-sonnet-5-5: [2.0, 10.0]
  budget_min: 95               # 한 번 실행에서 쓰는 최대 시간(분). 남은 건 다음 날 이어감

# ---------- 유튜브 주간 요약 (블로거 6명 관심사 기준) ----------
