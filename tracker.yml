name: 데이터 트래커
on:
  schedule:
    # GitHub는 정각(:00)에 예약이 몰려 지연·누락이 잦아서 분을 일부러 어긋나게 잡음
    - cron: "17 */6 * * *"     # 브리아셀: 6시간마다
    - cron: "23 22 14-16 * *"  # 오로라: 매월 15~17일 07:23 KST
    - cron: "37 0 2-5 * *"    # ISM PMI: 매월 2~5일 09:37 KST
    - cron: "43 7 8-15 * *"   # 일본 공작기계: 매월 8~15일 16:43 KST
    - cron: "7 0 * * 1"       # 구글 트렌드: 매주 월 09:07 KST
    - cron: "27 20 * * *"     # 인물 발언: 매일 05:27 KST 시작 → 6시 전후 도착
    - cron: "13 22 1-20 2,5,8,11 *"  # 13F: 제출 시즌(2·5·8·11월 1~20일)에만 07:13 KST 확인, 새 보고서가 있을 때만 전송
    - cron: "17 12 * * 0"     # 블로그 학습 + 쉰 블로거 대신 기사: 매주 일요일 21:17 KST
    - cron: "47 12 * * 0"     # 빅테크 자금 조달 요약: 매주 일요일 21:47 KST (있을 때만)
    - cron: "47 21 * * 1-5"   # 업종과 다르게 움직인 종목: 화~토 06:47 KST (미국장 마감 후)
    - cron: "17 0 * * 6"      # 약한 업종 속 강한 종목: 매주 토요일 09:17 KST
    - cron: "33 22 * * *"     # 자금 조달 계획 언급: 매일 07:33 KST (지난 24시간, 있을 때만)
    - cron: "17 23 * * 5"     # 유튜브 주간: 매주 토요일 08:17 KST (금요일 밤까지 1주일 영상 중 블로거 관심 영상 5편 안팎 요약)
    - cron: "13 21 * * *"     # 어닝콜 AI 체크: 매일 06:13 KST 시작 → 8시 전후 취합 전송 (해당 내용 있을 때만)
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 항목"
        type: choice
        options: [브리아셀, 오로라, ISM, 공작기계, 구글트렌드, 인물브리핑, 13F, 블로그주간, 자금조달, 자금조달기록, 업종일간, 업종주간, 어닝콜, 자금조달계획, 유튜브요약, 유튜브주간]
      url:
        description: "영상 주소 (유튜브요약을 고를 때만)"
        type: string
        required: false
      force:
        description: "이미 보낸 것이어도 지금 다시 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 어닝콜은 예약 실행과 수동 실행이 겹치지 않게 같은 그룹으로 묶음
  group: tracker-${{ (github.event.schedule == '13 21 * * *' || inputs.job == '어닝콜') && 'earnings' || (github.event.schedule || inputs.job) }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 무엇을 실행할지 결정
        id: pick
        env:
          SCHED: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$SCHED$JOB" in
            "17 */6 * * *"|브리아셀)     cmd="briacell.py";;
            "23 22 14-16 * *"|오로라)    cmd="aurora.py";;
            "37 0 2-5 * *"|ISM)         cmd="macro.py --only=ism_pmi";;
            "43 7 8-15 * *"|공작기계)   cmd="macro.py --only=jp_machine_tool";;
            "7 0 * * 1"|구글트렌드)     cmd="trends.py";;
            "27 20 * * *"|인물브리핑)   cmd="people.py";;
            "13 22 1-20 2,5,8,11 *"|13F) cmd="thirteenf.py";;
            "17 12 * * 0"|블로그주간)   cmd="blog_collect.py";;
            "47 12 * * 0"|자금조달)     cmd="funding.py";;
            자금조달기록)               cmd="funding.py --backfill";;
            "33 22 * * *"|자금조달계획) cmd="funding.py --plans";;
            "47 21 * * 1-5"|업종일간)  cmd="strength.py --daily";;
            "17 0 * * 6"|업종주간)     cmd="strength.py --weekly";;
            "13 21 * * *"|어닝콜)      cmd="earnings.py";;
            유튜브요약)                cmd="youtube.py";;
            "17 23 * * 5"|유튜브주간)  cmd="youtube.py --weekly";;
            *) echo "알 수 없는 실행: $SCHED$JOB"; exit 1;;
          esac
          if [ "$FORCE" = "true" ]; then case "$cmd" in blog_collect.py*) cmd="$cmd --force-send";; *) cmd="$cmd --force";; esac; fi
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          case "$cmd" in aurora.py*|people.py*|thirteenf.py*|blog_collect.py*|funding.py*|macro.py*|strength.py*|earnings.py*|youtube.py*) echo "browser=false" >> "$GITHUB_OUTPUT";; *) echo "browser=true" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 한글 폰트
        run: sudo apt-get install -y -qq fonts-nanum > /dev/null
      - name: 브라우저 설치
        if: steps.pick.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      - name: 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YT_URL: ${{ inputs.url }}
        run: python -u src/${{ steps.pick.outputs.cmd }}   # -u: 기록이 순서대로 남도록
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "state 업데이트"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
